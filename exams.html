<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exams — Prep Axiom Foundry</title>

  <meta name="description" content="PAF Exams — Live Evaluation Matrix Nodes."/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>

  <style>
    /* ── EXAM PAGE LAYOUT SYSTEM ── */
    #exam-main {
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      padding: 60px 40px;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Crosshair grid — mirrors the hero background */
    #exam-main::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,168,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,168,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Corner bracket — top-left, mirrors hero */
    #exam-main::after {
      content: '';
      position: absolute;
      top: 40px; left: 40px;
      width: 40px; height: 40px;
      border-top: 1px solid var(--blue);
      border-left: 1px solid var(--blue);
      pointer-events: none;
    }

    /* Corner bracket — bottom-right */
    .corner-br {
      position: absolute;
      bottom: 40px; right: 40px;
      width: 40px; height: 40px;
      border-bottom: 1px solid var(--blue);
      border-right: 1px solid var(--blue);
      pointer-events: none;
    }

    /* ── EXAM NODES CONTAINER DECK ── */
    .matrix-header {
      position: relative;
      z-index: 1;
      margin-bottom: 40px;
      max-width: 1000px;
    }

    .matrix-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 800;
      color: var(--text-head);
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .matrix-title span {
      color: var(--blue);
    }

    .exam-grid-deck {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      max-width: 1200px;
    }

    /* ── DYNAMIC CARD BLUEPRINT STYLING ── */
    .dynamic-exam-card {
      background: rgba(3, 13, 26, 0.75);
      border: 1px solid rgba(0, 170, 255, 0.12);
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .dynamic-exam-card:hover {
      border: 1px solid rgba(0, 170, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.1);
    }

    .exam-node-badge {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--blue);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: block;
    }

    .exam-node-title {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-head);
      margin: 0 0 14px 0;
      line-height: 1.3;
    }

    .exam-meta-row {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--grey);
      margin-bottom: 8px;
    }

    .exam-meta-row span {
      color: var(--white);
    }

    .exam-launch-btn {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: rgba(0, 170, 255, 0.08);
      border: 1px solid rgba(0, 170, 255, 0.3);
      color: var(--blue);
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .exam-launch-btn:hover {
      background: var(--blue);
      color: var(--black);
      border-color: var(--blue);
    }

    .grid-status-msg {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--grey);
      border-left: 2px solid var(--blue);
      padding: 12px 16px;
      background: rgba(0, 170, 255, 0.04);
      grid-column: 1 / -1;
    }

    /* Responsive adjustments */
    @media (max-width: 1080px) {
      #exam-main { margin-left: 0; padding: 100px 24px 40px 24px; }
    }
  </style>
</head>
<body>

<div id="intro-screen">
  <div id="intro-logo">
    <img src="logo.png" alt="PAF Logo" id="intro-img"/>
    <div id="intro-title">Prep Axiom Foundry</div>
    <div id="intro-sub">// EST. 2026 · GLOBAL ACADEMIC GUILD</div>
  </div>
</div>

<div id="particles"></div>

<aside id="sidebar">
  <div class="logo-wrap">
    <div class="logo-text">Prep Axiom<br>Foundry</div>
    <div class="logo-sub">// PAF — EST. 2026</div>
  </div>
  <nav>
    <a href="index.html"><span class="nav-icon">—</span>Home</a>
    <a href="hall-of-fame.html"><span class="nav-icon">—</span>Hall of Fame</a>
    <a href="members.html"><span class="nav-icon">—</span>Members</a>
    <a href="exams.html" class="active"><span class="nav-icon">—</span>Exams</a>
    <a href="index.html#about"><span class="nav-icon">—</span>About us</a>
  </nav>
  <div class="sidebar-footer">
    <div id="globalLoginWidget" style="margin-bottom: 12px;">
      <div id="globalLoginForm" style="display:none;">
        <input type="text" id="globalLoginUsername" placeholder="Discord Username"/>
        <input type="password" id="globalLoginPassword" placeholder="Password"/>
        <button id="globalLoginBtn">Sign In</button>
        <button id="globalLoginCancel">Cancel</button>
        <div id="globalLoginError" style="display:none;"></div>
      </div>
      <div id="globalLoginStatus" style="display:none; text-align:center;">
        <div style="font-family:'DM Mono',monospace; font-size:11px; color:var(--grey); margin-bottom:8px;">
          Logged in as <strong id="globalUserDisplay"></strong>
        </div>
        <button id="globalLogoutBtn">Log Out</button>
      </div>
      <button id="globalLoginToggle">Log In</button>
    </div>
    <a href="https://discord.gg/U4dCDkdUHw" class="discord-btn" target="_blank">Join Discord →</a>
  </div>
</aside>

<button id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>

<main id="exam-main">
  <div class="corner-br"></div>

  <div class="matrix-header">
    <span class="exam-node-badge">// AVAILABLE ASSESSMENTS</span>
    <h1 class="matrix-title">Evaluation <span>Matrix</span></h1>
  </div>

  <div class="exam-grid-deck" id="exam-cards-container">
    <div class="grid-status-msg">Synchronizing matrix stream data links...</div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyBuculpQXW1j_2eaWSOhO5mer--XwcwkmE",
    authDomain: "prepaxiomfoundry-d4a79.firebaseapp.com",
    projectId: "prepaxiomfoundry-d4a79",
    storageBucket: "prepaxiomfoundry-d4a79.firebasestorage.app",
    messagingSenderId: "851208226756",
    appId: "1:851208226756:web:5bdde19467ddf9e0eb4691"
  };

  var app = !firebase.apps.length ? firebase.initializeApp(firebaseConfig) : firebase.app();
  window.db = app.firestore();

  // REAL-TIME EVALUATION MATRIX DECK PIPELINE
  (function() {
    var container = document.getElementById("exam-cards-container");
    if (!container) return;

    window.db.collection("examData")
      .where("isLive", "==", true)
      .orderBy("creationTimestamp", "desc")
      .onSnapshot(function(snapshot) {
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = '<div class="grid-status-msg">// GRID ACCESS: No active evaluation nodes are broadcast on the network currently.</div>';
          return;
        }

        snapshot.forEach(function(doc) {
          var exam = doc.data();
          
          // Generate customized card module
          var card = document.createElement("div");
          card.className = "dynamic-exam-card";
          
          card.innerHTML = `
            <div>
              <span class="exam-node-badge">// NODE: ${exam.examId}</span>
              <h3 class="exam-node-title">${exam.title}</h3>
              <div class="exam-meta-row">Allocation: <span>${exam.durationMinutes} Minutes</span></div>
              <div class="exam-meta-row">Capacity: <span>${exam.totalQuestions} Quantifiers</span></div>
            </div>
            <button class="exam-launch-btn" onclick="executeFoundryAssessment('${exam.examId}')">Launch Entry Protocol</button>
          `;
          
          container.appendChild(card);
        });
      }, function(err) {
        console.error("Matrix compilation pipeline error: ", err);
        container.innerHTML = '<div class="grid-status-msg" style="color: #ff6464;">// PIPELINE DROPOUT: Authentication or indexing mismatch error occurred.</div>';
      });
  })();

  // Global scope route for exam entries integration
  function executeFoundryAssessment(id) {
    console.log("Compiling matrix node execution parameters for: " + id);
    alert("Initializing entry link protocol for evaluation unit: " + id);
    // Future assessment portal view routing injection logic can place here
  }
</script>

<script src="script.js"></script>
</body>
</html>
