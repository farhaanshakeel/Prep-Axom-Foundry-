<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exams — Prep Axiom Foundry</title>

  <meta name="description" content="PAF Exams — Coming Soon."/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>

  <style>
    /* ── EXAM PAGE — COMING SOON ── */
    #exam-main {
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Crosshair grid — mirrors the hero background */
    #exam-main::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,168,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,168,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Corner bracket — top-left, mirrors hero */
    #exam-main::after {
      content: '';
      position: absolute;
      top: 40px; left: 40px;
      width: 40px; height: 40px;
      border-top: 1px solid var(--blue);
      border-left: 1px solid var(--blue);
      pointer-events: none;
    }

    /* Corner bracket — bottom-right */
    .corner-br {
      position: absolute;
      bottom: 40px; right: 40px;
      width: 40px; height: 40px;
      border-bottom: 1px solid var(--blue);
      border-right: 1px solid var(--blue);
      pointer-events: none;
    }

    /* ── COMING SOON TEXT ── */
    .coming-soon-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
      padding: 40px;
    }

    .coming-soon-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .coming-soon-text {
      font-family: var(--font-display);
      font-size: clamp(52px, 9vw, 110px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text-head);

      /* layered glow */
      text-shadow:
        0 0 20px rgba(0, 168, 255, 0.55),
        0 0 60px rgba(0, 168, 255, 0.30),
        0 0 120px rgba(0, 168, 255, 0.15);

      animation: pulse-glow 3.2s ease-in-out infinite;
    }

    .coming-soon-text span {
      color: var(--blue);
      text-shadow:
        0 0 24px rgba(0, 168, 255, 0.85),
        0 0 70px rgba(0, 168, 255, 0.50),
        0 0 140px rgba(0, 168, 255, 0.25);
    }

    @keyframes pulse-glow {
      0%, 100% {
        text-shadow:
          0 0 20px rgba(0, 168, 255, 0.55),
          0 0 60px rgba(0, 168, 255, 0.30),
          0 0 120px rgba(0, 168, 255, 0.15);
      }
      50% {
        text-shadow:
          0 0 30px rgba(0, 168, 255, 0.80),
          0 0 90px rgba(0, 168, 255, 0.50),
          0 0 180px rgba(0, 168, 255, 0.25);
      }
    }

    .coming-soon-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 1080px) {
      #exam-main { margin-left: 0; }
    }
    @media (max-width: 760px) {
      #exam-main { padding-top: 72px; }
      .coming-soon-text { font-size: clamp(40px, 14vw, 72px); }
    }
  </style>
</head>
<body>

<!-- ══ INTRO SCREEN ══ -->
<div id="intro-screen">
  <div id="intro-logo">
    <img src="logo.png" alt="PAF Logo" id="intro-img"/>
    <div id="intro-title">Prep Axiom Foundry</div>
    <div id="intro-sub">// EST. 2026 · GLOBAL ACADEMIC GUILD</div>
  </div>
</div>

<div id="particles"></div>

<aside id="sidebar">
  <div class="logo-wrap">
    <div class="logo-text">Prep Axiom<br>Foundry</div>
    <div class="logo-sub">// PAF — EST. 2026</div>
  </div>
  <nav>
    <a href="index.html"><span class="nav-icon">—</span>Home</a>
    <a href="hall-of-fame.html"><span class="nav-icon">—</span>Hall of Fame</a>
    <a href="members.html"><span class="nav-icon">—</span>Members</a>
    <a href="exams.html" class="active"><span class="nav-icon">—</span>Exams</a>
    <a href="index.html#about"><span class="nav-icon">—</span>About us</a>
  </nav>
  <div class="sidebar-footer">
    <div id="globalLoginWidget" style="margin-bottom: 12px;">
      <div id="globalLoginForm" style="display:none;">
        <input type="text" id="globalLoginUsername" placeholder="Discord Username"/>
        <input type="password" id="globalLoginPassword" placeholder="Password"/>
        <button id="globalLoginBtn">Sign In</button>
        <button id="globalLoginCancel">Cancel</button>
        <div id="globalLoginError" style="display:none;"></div>
      </div>
      <div id="globalLoginStatus" style="display:none; text-align:center;">
        <div style="font-family:'DM Mono',monospace; font-size:11px; color:var(--grey); margin-bottom:8px;">
          Logged in as <strong id="globalUserDisplay"></strong>
        </div>
        <button id="globalLogoutBtn">Log Out</button>
      </div>
      <button id="globalLoginToggle">Log In</button>
    </div>
    <a href="https://discord.gg/U4dCDkdUHw" class="discord-btn" target="_blank">Join Discord →</a>
  </div>
</aside>

<button id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>

<main id="exam-main">
  <div class="corner-br"></div>

  <div class="coming-soon-wrap">
    <span class="coming-soon-label">// Exams — PAF</span>
    <div class="coming-soon-text">Coming <span>Soon</span></div>
    <span class="coming-soon-sub">// Stay tuned · Discord for updates</span>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
