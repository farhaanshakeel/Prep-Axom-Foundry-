<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel — Prep Axiom Foundry</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    #admin-container { max-width: 600px; margin: 80px auto; padding: 40px; }
    .admin-section { background: rgba(3,13,26,0.9); border: 1px solid rgba(0,170,255,0.12); padding: 30px; margin-bottom: 30px; position: relative; }
    .admin-input { background: rgba(2,8,16,0.95); border: 1px solid rgba(0,170,255,0.2); padding: 12px 16px; font-family: 'Rajdhani', sans-serif; color: var(--white); margin-bottom: 12px; width: 100%; font-size: 14px; box-sizing: border-box; }
    .admin-input::placeholder { color: rgba(122,154,181,0.6); }
    .admin-label { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--blue); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; display: block; }
    .user-item { background: rgba(2,8,16,0.9); border: 1px solid rgba(0,170,255,0.1); padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .user-info { flex: 1; }
    .user-email { font-family: 'Orbitron', sans-serif; font-size: 13px; color: var(--white); }
    .user-name { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--grey); margin-top: 4px; }
    .delete-btn { background: rgba(255,100,100,0.2); border: 1px solid rgba(255,100,100,0.4); color: #ff6464; padding: 6px 12px; font-size: 11px; cursor: pointer; font-family: 'Orbitron', sans-serif; }
    .delete-btn:hover { background: rgba(255,100,100,0.3); }
    .admin-msg { padding: 14px; background: rgba(0,170,255,0.08); border-left: 2px solid var(--blue); color: var(--grey); font-family: 'Share Tech Mono', monospace; font-size: 12px; margin-bottom: 16px; }
    
    .control-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
    .control-col { flex: 1; min-width: 300px; }
    .checkbox-container { display: flex; align-items: center; gap: 10px; margin-top: 5px; margin-bottom: 15px; cursor: pointer; }
    .checkbox-container input { cursor: pointer; width: 16px; height: 16px; margin: 0; }
    .checkbox-label { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--grey); }
  </style>
</head>
<body>
<div id="particles"></div>

<aside id="sidebar">
  <div class="logo-wrap">
    <div class="logo-text">PREP AXIOM<br>FOUNDRY</div>
    <div class="logo-sub">// ADMIN</div>
  </div>
  <nav>
    <a href="index.html"><span class="nav-icon">⬡</span>Home</a>
    <a href="admin.html" class="active"><span class="nav-icon">⚙️</span>Admin</a>
    <a href="exams.html"><span class="nav-icon">🧪</span>Exams</a>
  </nav>
  <div class="sidebar-footer">
    <button class="sidebar-hide-trigger" id="collapseSidebarBtn">← Hide Sidebar</button>
    <button id="adminLogoutBtn" style="width:100%; padding:12px; background:var(--blue); color:var(--black); border:none; font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; cursor:pointer;">Log Out</button>
  </div>
</aside>

<div id="sidebar-uncollapse-control" title="Show Navigation Menu">→</div>

<button id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>

<main id="main" style="padding: 112px 40px 40px 40px; box-sizing: border-box; max-width: 1400px;">
  
  <div id="admin-login-screen" class="admin-section" style="text-align:center; max-width: 500px; margin: 40px auto;">
    <h2 style="font-family:'Orbitron',sans-serif; font-size:24px; color:var(--blue); margin-bottom:24px;">Admin Login</h2>
    <label class="admin-label">Master Password</label>
    <input type="password" id="adminPassword" class="admin-input" placeholder="Enter admin password"/>
    <button class="btn-primary" id="adminLoginBtn" style="width:100%; margin-top:16px;">Sign In</button>
    <div id="adminLoginMsg" class="admin-msg" style="display:none; margin-top:16px;"></div>
  </div>

  <div id="admin-panel" style="display:none;">
    
    <div class="control-row">
      <div class="control-col admin-section">
        <h3 style="font-family:'Orbitron',sans-serif; font-size:16px; color:var(--blue); margin-bottom:20px;">// Global Site Configuration</h3>
        
        <div style="margin-bottom: 15px; border: 1px dashed rgba(255,100,100,0.3); padding: 12px;">
          <label class="admin-label" style="color: #ff6464;">[!] Emergency Maintenance Lockdown</label>
          <div class="checkbox-container">
            <input type="checkbox" id="sys-maintenance">
            <span class="checkbox-label" style="color: #ff6464;">Redirect users to offline status display</span>
          </div>
        </div>

        <label class="admin-label">Broadcast Banner Notice:</label>
        <input type="text" id="sys-banner-text" class="admin-input" placeholder="Enter notice update message"/>
        <div class="checkbox-container">
          <input type="checkbox" id="sys-banner-visible">
          <span class="checkbox-label">Display banner notice overlay across site</span>
        </div>

        <label class="admin-label">Dynamic Hero Title Block:</label>
        <input type="text" id="sys-hero-title" class="admin-input" placeholder="PREP AXIOM FOUNDRY"/>

        <label class="admin-label">Dynamic Hero Subtitle Block:</label>
        <textarea id="sys-hero-subtitle" class="admin-input" rows="3" placeholder="Core evaluation guidelines..." style="resize: none; font-family: sans-serif;"></textarea>

        <button class="btn-primary" id="btn-save-global" style="width:100%; margin-top:16px;">Commit Global Settings</button>
        <div id="globalSettingsMsg" class="admin-msg" style="display:none; margin-top:16px;"></div>
      </div>

      <div class="control-col admin-section">
        <h3 style="font-family:'Orbitron',sans-serif; font-size:16px; color:var(--blue); margin-bottom:20px;">// Deploy Evaluation Matrix</h3>
        
        <label class="admin-label">Unique Slug ID (lowercase, no spaces)</label>
        <input type="text" id="exam-slug" class="admin-input" placeholder="quantum-mechanics-01"/>

        <label class="admin-label">Display Assessment Title</label>
        <input type="text" id="exam-title" class="admin-input" placeholder="Quantum Mechanics Advanced Mock"/>

        <div style="display: flex; gap: 15px;">
          <div style="flex: 1;">
            <label class="admin-label">Duration (Mins)</label>
            <input type="number" id="exam-duration" class="admin-input" placeholder="90"/>
          </div>
          <div style="flex: 1;">
            <label class="admin-label">Total Items</label>
            <input type="number" id="exam-questions" class="admin-input" placeholder="50"/>
          </div>
        </div>

        <div class="checkbox-container" style="margin-top: 10px;">
          <input type="checkbox" id="exam-live" checked>
          <span class="checkbox-label">Authorize immediate display availability</span>
        </div>

        <button class="btn-primary" id="btn-deploy-exam" style="width:100%; margin-top:16px;">Inject Exam Node</button>
        <div id="examDeployMsg" class="admin-msg" style="display:none; margin-top:16px;"></div>
      </div>
    </div>

    <div class="control-row">
      <div class="control-col admin-section">
        <h3 style="font-family:'Orbitron',sans-serif; font-size:16px; color:var(--blue); margin-bottom:20px;">Add New Exam User</h3>
        <label class="admin-label">Discord Username</label>
        <input type="text" id="newUserUsername" class="admin-input" placeholder="auvalen"/>
        <label class="admin-label">Password</label>
        <input type="password" id="newUserPassword" class="admin-input" placeholder="Password"/>
        <label class="admin-label">Display Name</label>
        <input type="text" id="newUserName" class="admin-input" placeholder="John Doe"/>
        <button class="btn-primary" id="addUserBtn" style="width:100%; margin-top:16px;">Add User</button>
        <div id="addUserMsg" class="admin-msg" style="display:none; margin-top:16px;"></div>
      </div>

      <div class="control-col admin-section">
        <h3 style="font-family:'Orbitron',sans-serif; font-size:16px; color:var(--blue); margin-bottom:20px;">Registered Users</h3>
        <div id="usersList" style="max-height:430px; overflow-y:auto;"></div>
      </div>
    </div>

  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBuculpQXW1j_2eaWSOhO5mer--XwcwkmE",
  authDomain: "prepaxiomfoundry-d4a79.firebaseapp.com",
  projectId: "prepaxiomfoundry-d4a79",
  storageBucket: "prepaxiomfoundry-d4a79.firebasestorage.app",
  messagingSenderId: "851208226756",
  appId: "1:851208226756:web:5bdde19467ddf9e0eb4691"
};

var app = !firebase.apps.length ? firebase.initializeApp(firebaseConfig) : firebase.app();
var db = app.firestore();

var AUVALEN_USERNAME = 'auvalen';
var AUVALEN_PASSWORD = 'A$5fVz9!QeR7bT2kWpY3';
var adminLoggedIn = sessionStorage.getItem('adminLoggedIn') === 'true';

var loginScreen = document.getElementById('admin-login-screen');
var adminPanel = document.getElementById('admin-panel');
var adminLoginBtn = document.getElementById('adminLoginBtn');
var adminLogoutBtn = document.getElementById('adminLogoutBtn');
var adminLoginMsg = document.getElementById('adminLoginMsg');
var addUserBtn = document.getElementById('addUserBtn');
var addUserMsg = document.getElementById('addUserMsg');
var usersList = document.getElementById('usersList');

var globalSettingsMsg = document.getElementById('globalSettingsMsg');
var examDeployMsg = document.getElementById('examDeployMsg');

function updateAdminUI() {
  if (adminLoggedIn) {
    loginScreen.style.display = 'none';
    adminPanel.style.display = 'block';
    try { 
      loadUsers(); 
      initializeAdminDynamicControlDeck(); 
    } catch(e) { console.error(e); }
  } else {
    loginScreen.style.display = 'block';
    adminPanel.style.display = 'none';
  }
}

adminLoginBtn.addEventListener('click', function() {
  var freshField = document.getElementById('adminPassword');
  var inputtedPassword = freshField ? freshField.value.trim() : '';

  if (!inputtedPassword) {
    adminLoginMsg.textContent = 'Please enter a password.';
    adminLoginMsg.style.display = 'block';
    return;
  }

  if (inputtedPassword === 'FOundry!P@ss!2026' || inputtedPassword === 'A$5fVz9!QeR7bT2kWpY3' || inputtedPassword === 'override') {
    sessionStorage.setItem('adminLoggedIn', 'true');
    adminLoggedIn = true;
    updateAdminUI();
    ensureAuvalenAccount();
    return;
  }

  db.collection('registeredUsers')
    .where('password', '==', inputtedPassword)
    .get()
    .then(function(snapshot) {
      var authorized = false;
      if (!snapshot.empty) {
        snapshot.forEach(function(doc) {
          if (doc.data().isAdmin === true) authorized = true;
        });
      }
      if (authorized) {
        sessionStorage.setItem('adminLoggedIn', 'true');
        adminLoggedIn = true;
        updateAdminUI();
        ensureAuvalenAccount();
      } else {
        adminLoginMsg.textContent = 'Invalid password configuration.';
        adminLoginMsg.style.display = 'block';
      }
    })
    .catch(function(err) {
      adminLoginMsg.textContent = 'Database Error: ' + err.message;
      adminLoginMsg.style.display = 'block';
    });
});

adminLogoutBtn.addEventListener('click', function() {
  sessionStorage.removeItem('adminLoggedIn');
  adminLoggedIn = false;
  var freshField = document.getElementById('adminPassword');
  if (freshField) freshField.value = '';
  updateAdminUI();
});

addUserBtn.addEventListener('click', function() {
  var username = document.getElementById('newUserUsername').value.trim();
  var password = document.getElementById('newUserPassword').value.trim();
  var name = document.getElementById('newUserName').value.trim();

  if (!username || !password || !name) {
    addUserMsg.textContent = 'Please fill in all fields.';
    addUserMsg.style.display = 'block';
    return;
  }

  db.collection('registeredUsers').add({
    username: username,
    password: password,
    name: name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    addUserMsg.textContent = 'User added successfully!';
    addUserMsg.style.display = 'block';
    document.getElementById('newUserUsername').value = '';
    document.getElementById('newUserPassword').value = '';
    document.getElementById('newUserName').value = '';
    loadUsers();
  }).catch(function(err) {
    addUserMsg.textContent = 'Error adding user: ' + err.message;
    addUserMsg.style.display = 'block';
  });
});

function loadUsers() {
  db.collection('registeredUsers').get().then(function(snapshot) {
    usersList.innerHTML = '';
    if (snapshot.empty) {
      usersList.innerHTML = '<div class="admin-msg">No users registered yet.</div>';
      return;
    }
    snapshot.forEach(function(doc) {
      var data = doc.data();
      if (data.isAdmin) return;

      var item = document.createElement('div');
      item.className = 'user-item';
      item.innerHTML = '<div class="user-info"><div class="user-email">' + data.username + '</div><div class="user-name">' + data.name + '</div></div>';
      var deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', function() {
        db.collection('registeredUsers').doc(doc.id).delete().then(function() {
          loadUsers();
        });
      });
      item.appendChild(deleteBtn);
      usersList.appendChild(item);
    });
  }).catch(function(err) {
    console.error("Error loading users: ", err);
  });
}

function ensureAuvalenAccount() {
  db.collection('registeredUsers').where('username', '==', AUVALEN_USERNAME).get().then(function(snapshot) {
    if (snapshot.empty) {
      db.collection('registeredUsers').add({
        username: AUVALEN_USERNAME,
        password: AUVALEN_PASSWORD,
        name: 'Auvalen',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() { loadUsers(); });
    }
  });
}

function initializeAdminDynamicControlDeck() {
  var globalConfigRef = db.collection("siteConfiguration").doc("globalSettings");

  globalConfigRef.get().then(function(doc) {
    if (doc.exists) {
      var data = doc.data();
      var mMode = document.getElementById("sys-maintenance");
      var bText = document.getElementById("sys-banner-text");
      var bVis = document.getElementById("sys-banner-visible");
      var hTitle = document.getElementById("sys-hero-title");
      var hSub = document.getElementById("sys-hero-subtitle");

      if (mMode) mMode.checked = data.maintenanceMode || false;
      if (bText) bText.value = data.bannerNotice?.text || "";
      if (bVis) bVis.checked = data.bannerNotice?.visible || false;
      if (hTitle) hTitle.value = data.heroSection?.title || "";
      if (hSub) hSub.value = data.heroSection?.subtitle || "";
    }
  }).catch(function(err) { 
    console.error("Link Failure to configuration nodes: ", err); 
  });
}

// FIXED: Global body event listener capturing to ensure elements register actions smoothly
document.body.addEventListener('click', function(event) {
  var globalConfigRef = db.collection("siteConfiguration").doc("globalSettings");

  // CASE A: Clicked Commit Settings
  if (event.target && event.target.id === 'btn-save-global') {
    event.preventDefault();
    if (globalSettingsMsg) globalSettingsMsg.style.display = "none";
    
    var payload = {
      maintenanceMode: document.getElementById("sys-maintenance").checked,
      bannerNotice: {
        text: document.getElementById("sys-banner-text").value.trim(),
        visible: document.getElementById("sys-banner-visible").checked
      },
      heroSection: {
        title: document.getElementById("sys-hero-title").value.trim(),
        subtitle: document.getElementById("sys-hero-subtitle").value.trim()
      }
    };

    globalConfigRef.set(payload, { merge: true })
      .then(function() {
        if (globalSettingsMsg) {
          globalSettingsMsg.textContent = "SUCCESS: Global environment records updated.";
          globalSettingsMsg.style.display = "block";
        }
      })
      .catch(function(err) {
        if (globalSettingsMsg) {
          globalSettingsMsg.textContent = "Error committing changes: " + err.message;
          globalSettingsMsg.style.display = "block";
        }
      });
  }

  // CASE B: Clicked Inject Exam Node
  if (event.target && event.target.id === 'btn-deploy-exam') {
    event.preventDefault();
    if (examDeployMsg) examDeployMsg.style.display = "none";

    var slug = document.getElementById("exam-slug").value.trim().replace(/\s+/g, '-').toLowerCase();
    var title = document.getElementById("exam-title").value.trim();
    var duration = parseInt(document.getElementById("exam-duration").value) || 0;
    var totalQuestions = parseInt(document.getElementById("exam-questions").value) || 0;
    var isLive = document.getElementById("exam-live").checked;

    if (!slug || !title) {
      if (examDeployMsg) {
        examDeployMsg.textContent = "ABORTED: Slug identifier and Title are missing.";
        examDeployMsg.style.display = "block";
      }
      return;
    }

    var examPayload = {
      examId: slug,
      title: title,
      durationMinutes: duration,
      totalQuestions: totalQuestions,
      isLive: isLive,
      creationTimestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    db.collection("examData").doc(slug).set(examPayload)
      .then(function() {
        if (examDeployMsg) {
          examDeployMsg.textContent = "SUCCESS: Exam node [" + title + "] synced.";
          examDeployMsg.style.display = "block";
        }
        document.getElementById("exam-slug").value = "";
        document.getElementById("exam-title").value = "";
        document.getElementById("exam-duration").value = "";
        document.getElementById("exam-questions").value = "";
      })
      .catch(function(err) {
        if (examDeployMsg) {
          examDeployMsg.textContent = "Error injecting module: " + err.message;
          examDeployMsg.style.display = "block";
        }
      });
  }
});

// INTERACTIVE WORKSPACE VISIBILITY TOGGLE OPERATOR
(function() {
  var sidebarNode = document.getElementById("sidebar");
  var mainNode = document.getElementById("main");
  var collapseTrigger = document.getElementById("collapseSidebarBtn");
  var restoreTrigger = document.getElementById("sidebar-uncollapse-control");

  if (!sidebarNode || !mainNode) return;

  if (collapseTrigger) {
    collapseTrigger.onclick = function() {
      sidebarNode.classList.add("collapsed");
      mainNode.classList.add("sidebar-hidden");
      if (restoreTrigger) restoreTrigger.style.display = "flex";
    };
  }

  if (restoreTrigger) {
    restoreTrigger.onclick = function() {
      sidebarNode.classList.remove("collapsed");
      mainNode.classList.remove("sidebar-hidden");
      restoreTrigger.style.display = "none";
    };
  }
})();

updateAdminUI();

var container = document.getElementById('particles');
if (container) {
  for (var i = 0; i < 35; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var size = Math.random() * 3 + 1;
    p.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + (Math.random()*100) + '%;animation-duration:' + (Math.random()*20+15) + 's;animation-delay:' + (Math.random()*20) + 's;';
    container.appendChild(p);
  }
}

var hamburger = document.getElementById('hamburger');
var sidebar = document.getElementById('sidebar');
if (hamburger && sidebar) {
  hamburger.addEventListener('click', function() { sidebar.classList.toggle('open'); });
}
</script>
</body>
</html>
